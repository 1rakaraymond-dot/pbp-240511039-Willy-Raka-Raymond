
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>

    <div class="app">
        <header>
            <h1>My To-Do List</h1>
            <p>Catat dan selesaikan tugas harianmu.</p>
        </header>

        <form id="task-form">
            <input
                type="text"
                id="task-input"
                placeholder="Masukkan tugas baru..."
                maxlength="120"
                required
            >
            <button type="submit">Tambah</button>
        </form>

        <section class="task-section">
            <h2>Daftar Tugas</h2>

            <p id="task-summary" aria-live="polite">
                Belum ada tugas.
            </p>

            <ul id="task-list"></ul>

            <p id="empty-state">
                Belum ada tugas. Tambahkan tugas pertamamu!
            </p>
        </section>
    </div>

</body>
</html>
